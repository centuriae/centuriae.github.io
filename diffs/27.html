rvation of life, particularly surface\nlife [^1][^2]. Earth, however, experienced more of these\nimpactors due to its stronger gravity; for example, the collision with\nTheia, the Mars-sized object from which part of the material would later\nform our Moon, may have sterilized our planet [^4]. Mars also\ncooled down faster due to being only about 10% as massive as Earth,\nresulting in potentially stable surface conditions earlier than on\nEarth.\n\nMany of the hypotheses for the origin of life, including the popular\nmarine hydrothermal vent and hot spring hypotheses, have also been\nproposed as possible, and in some cases even more favourable,\nenvironments on Mars that could have supported the emergence of life\n[^5]. For example, warm freshwater ponds, such as those found in\nvolcanic regions or around hot springs, provide compelling conditions\nfor the emergence of life. It is this latter environment that makes Mars\nparticularly interesting. Ancient Martian hot springs would likely have\nbeen far more stationary than those on Earth because of the planet's\nmuch lower levels of tectonic activity [^5].\n\nLuckily for us, this, combined with Mars' much lower weathering rates\nthroughout its history, has resulted in the planet preserving a far\nolder and better geological record than Earth. Therefore, Mars could\npotentially be the place where we eventually discover the earliest\ntraces of life.\n\n## 3. From a galaxy far away?\n\nThis naturally begs the question: if life could have emerged on Mars and\ntravelled to Earth aboard meteorites, could it not also have travelled\nto us from a galaxy far away? The broader idea that life originated\nelsewhere in the universe and spread between planets is known as\npanspermia.\n\nProbably not from another galaxy. The gap between the Milky Way and the\nAndromeda Galaxy, our nearest large galactic neighbour, is about 2.5\nmillion light-years. A rock would require billions of years to cross\nsuch a distance, and no known microbe or spore shielded inside a\nmeteorite could survive exposure to cosmic radiation for that long. Of\ncourse, if life had been deliberately transported by an advanced\ncivilisation, this would still remain a possibility, although one that\nis considered much more fringe.\n\nWithin our own Solar System, however, there are multiple worlds from\nwhich life could also have potentially travelled, albeit less plausibly\nthan from Mars.\n\nAll in all, incredible as it already is that life emerged on Earth, I\nfind it even more exciting to think that our oldest relatives may have\nlived somewhere we could not meet (yet) for Sunday brunch. Greetings to\nthem from Earth!\n\n**Disclaimer:** Things are not very accurate, but due to the fact that\nI've only just really read one book about it, and that this text will\nnot be a scientific source, I will leave it at this. \u2014 Merel out.\n\n## References\n\n[^1]: Paul Davies. *The Eerie Silence: Renewing Our Search\n    for Alien Intelligence*. Houghton Mifflin Harcourt, Boston, 2010.\n\n[^2]: Joseph R. Michalski, Tullis C. Onstott, Stephen J.\n    Mojzsis, John Mustard, Queenie H. S. Chan, Paul B. Niles, and Sarah\n    Stewart Johnson. *The Martian subsurface as a potential window into\n    the origin of life*. *Nature Geoscience*, 11(1):21--26, 2018.\n\n[^3]: Scripps Institution of Oceanography. *Research\n    highlight: Ancient plate tectonics*.\n    https://scripps.ucsd.edu/news/research-highlight-ancient-plate-tectonics,\n    April 2007. Accessed: 2026-07-12.\n\n[^4]: Gregory M. Davis, Jonathan Horner, Bradley D. Carter,\n    and Stephen C. Marsden. *Could life have been transferred from Mars\n    to Earth? Laboratory and computational simulations of Martian\n    ejecta*, 2026. Accepted to appear in the peer-reviewed proceedings\n    of the 24th Australian Space Research Conference.\n\n[^5]: Alex Longo and Bruce Damer. *Factoring origin of life\n    hypotheses into the search for life in the solar system and beyond*.\n    *
